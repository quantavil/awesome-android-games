<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Accent Green/Cyan Gradient for Android / Gaming -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3ddc84" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Background -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="200" rx="16" fill="url(#grid)" />
  <rect width="900" height="200" rx="16" fill="none" stroke="rgba(61, 220, 132, 0.2)" stroke-width="2" />

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="100" r="90" fill="#3ddc84" opacity="0.08" filter="url(#glow)" />
  <circle cx="800" cy="100" r="100" fill="#00e5ff" opacity="0.06" filter="url(#glow)" />

  <!-- Left Icon: Stylized Android Game Controller -->
  <g transform="translate(60, 30)">
    <!-- Controller Body Outline / Glow -->
    <rect x="0" y="20" width="130" height="90" rx="35" fill="#162032" stroke="url(#accentGrad)" stroke-width="3" />
    
    <!-- Android Head Curve on Top of Controller -->
    <path d="M 35 20 A 30 30 0 0 1 95 20 Z" fill="#3ddc84" />
    <!-- Antennas -->
    <line x1="45" y1="12" x2="38" y2="0" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" />
    <line x1="85" y1="12" x2="92" y2="0" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" />
    <!-- Android Eyes -->
    <circle cx="52" cy="12" r="3.5" fill="#0b0f19" />
    <circle cx="78" cy="12" r="3.5" fill="#0b0f19" />

    <!-- D-PAD (Left) -->
    <rect x="25" y="55" width="24" height="8" rx="2" fill="#3ddc84" />
    <rect x="33" y="47" width="8" height="24" rx="2" fill="#3ddc84" />

    <!-- Action Buttons (Right) -->
    <circle cx="100" cy="51" r="5" fill="#00e5ff" />
    <circle cx="91" cy="60" r="5" fill="#3ddc84" />
    <circle cx="109" cy="60" r="5" fill="#3ddc84" />
    <circle cx="100" cy="69" r="5" fill="#00e5ff" />

    <!-- Thumbstick / Center Indicator -->
    <circle cx="65" cy="72" r="7" fill="#202d42" stroke="#3ddc84" stroke-width="1.5" />
  </g>

  <!-- Typography & Text Details -->
  <g transform="translate(230, 15)">
    <!-- Subtitle / Tag -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#3ddc84" letter-spacing="3">CURATED OPEN-SOURCE DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#accentGrad)" letter-spacing="0.5">Awesome Android Games</text>

    <!-- Description -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9ca3af">
      A curated collection of open-source games, engines, and codebases for Android.
    </text>
  </g>
</svg>
