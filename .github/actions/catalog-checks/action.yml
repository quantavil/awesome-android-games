name: Catalog checks
description: Run the test suite, Ruff lint, and Ruff format check. Requires uv on PATH and a checked-out repository.

# Single definition of the checks that gate every catalog write and every PR.
runs:
  using: composite
  steps:
    - name: Run tests
      shell: bash
      run: uv run pytest

    - name: Lint with Ruff
      shell: bash
      run: uv run ruff check .

    - name: Check formatting with Ruff
      shell: bash
      run: uv run ruff format --check .
