name: Update Game Stats

on:
  schedule:
    # Run every Sunday at 03:27 UTC (off-peak low-load window)
    - cron: '27 3 * * 0'
  workflow_dispatch:

# Shared with issueops.yml so catalog writes never overlap.
concurrency:
  group: catalog-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Run Stats Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python src/update_stats.py

      - name: Run Integrity Tests & Linter
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Commit & Push changes
        run: |
          bash .github/scripts/commit-catalog.sh "chore: auto-update game stats & stars"
