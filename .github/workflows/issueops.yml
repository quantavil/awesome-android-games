name: IssueOps Game Automation

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

# Share one queue with update-stats.yml so two runs never rewrite games.json at once.
concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  issueops:
    # Trigger if:
    # 1. Comment starts with /add or /remove by repo collaborator/member/owner
    # 2. Issue labeled with approved-add or approved-remove
    if: >-
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
       contains(fromJSON('["approved-add", "approved-remove"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Execute IssueOps Handler
        id: handler
        run: |
          # Keep going on a non-zero exit so the failure message still reaches the issue.
          set +e
          OUTPUT=$(uv run python src/issueops_handler.py --event-path "$GITHUB_EVENT_PATH")
          STATUS=$?
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Sync README and Live Stats
        id: sync
        if: steps.handler.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python src/update_stats.py

      - name: Run Integrity Tests & Linter
        id: checks
        if: steps.sync.outcome == 'success'
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Commit & Push Changes
        id: commit_push
        if: steps.checks.outcome == 'success'
        run: |
          bash .github/scripts/commit-catalog.sh "chore(catalog): auto-update games via IssueOps"

      - name: Comment on Issue & Close
        if: always() && steps.handler.conclusion != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            let handlerOutput = {};
            try {
              handlerOutput = JSON.parse(process.env.HANDLER_OUTPUT || '{}');
            } catch (e) {
              handlerOutput = { success: false, message: 'An unexpected error occurred during IssueOps processing.' };
            }

            // Only report success and close when every step after the handler also passed.
            const pipelineOk = handlerOutput.success === true
              && process.env.SYNC_OUTCOME === 'success'
              && process.env.CHECKS_OUTCOME === 'success'
              && process.env.COMMIT_OUTCOME === 'success';

            let message;
            if (pipelineOk) {
              message = handlerOutput.message || 'IssueOps processing completed.';
            } else if (handlerOutput.success === true) {
              message = `${handlerOutput.message || 'The request was processed.'}\n\n` +
                'However, the catalog update failed afterwards (stats sync, tests, or push). ' +
                'The issue was left open; see the workflow run logs.';
            } else {
              message = handlerOutput.message || 'IssueOps processing failed.';
            }

            const commentBody = `🤖 **IssueOps Automation:**\n\n${message}\n\nThank you for contributing to **Awesome Android Games**! ✨`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: commentBody
            });

            if (pipelineOk) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
        env:
          HANDLER_OUTPUT: ${{ steps.handler.outputs.output }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_push.outcome }}
